<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I2F Student Services - Our Services</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Poppins:wght@400;500;600&family=Muli:wght@400;600&family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
</head>
<body>
    <header class="bg-primary text-white fixed w-full z-10">
        <nav class="container mx-auto px-4 py-4 flex justify-between items-center">
            <a href="/" class="text-2xl font-bold">I2F Student Services</a>
            <button id="mobileMenuButton" class="md:hidden">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7"></path>
                </svg>
            </button>
            <ul id="mobileMenu" class="hidden md:flex space-x-4">
                <li><a href="/" class="hover:text-secondary transition-colors duration-300">Home</a></li>
                <li><a href="service.html" class="hover:text-secondary transition-colors duration-300">Services</a></li>
                <li><a href="about.html" class="hover:text-secondary transition-colors duration-300">About Us</a></li>
                <li><a href="contact.html" class="hover:text-secondary transition-colors duration-300">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main class="pt-20">
        <section class="py-12 bg-gray-100">
            <div class="container mx-auto px-4">
                <h1 class="text-4xl font-bold text-center mb-8">Our Services</h1>
                <div id="servicesGrid" class="grid gap-8 md:grid-cols-2 lg:grid-cols-3">
                    <!-- Services will be dynamically inserted here -->
                </div>
            </div>
        </section>
    </main>

    <footer class="bg-primary text-white py-6">
        <div class="container mx-auto text-center">
            <p>&copy; 2023 I2F Student Services. All rights reserved.</p>
        </div>
    </footer>

    <script>
        // Mobile menu toggle
        const mobileMenuButton = document.getElementById('mobileMenuButton');
        const mobileMenu = document.getElementById('mobileMenu');
        mobileMenuButton.addEventListener('click', () => {
            mobileMenu.classList.toggle('hidden');
        });

        // Services data
        const services = [
            {
                title: "University Admissions",
                shortDescription: "Expert guidance for your university application process.",
                fullDescription: "Navigating university applications can be overwhelming, but we're here to make it easy. From selecting the right university to preparing a strong application, our admissions support guides you at every step, ensuring you're ready to take on your academic journey with confidence."
            },
            {
                title: "Visa Procedures",
                shortDescription: "Simplifying your student visa application process.",
                fullDescription: "Getting a visa is a crucial step in studying abroad, and we simplify the entire process. We help you gather the right documents, complete applications, and prepare for embassy interviews—so you can focus on your future, not the paperwork."
            },
            {
                title: "Accommodation",
                shortDescription: "Finding your perfect home away from home.",
                fullDescription: "Finding a safe, affordable place to live in a new country is challenging. With our trusted partnerships, we help secure housing options tailored to your needs, whether you prefer shared student housing or private apartments."
            },
            {
                title: "Airport Pickup",
                shortDescription: "A warm welcome upon your arrival in France.",
                fullDescription: "Arriving in a new country can be daunting. We offer airport pickup services to take you from the terminal to your new home, making sure you start your journey in France with comfort and ease."
            }
        ];

        // Populate services
        const servicesGrid = document.getElementById('servicesGrid');
        services.forEach((service, index) => {
            const serviceElement = document.createElement('div');
            serviceElement.className = 'service-card bg-white rounded-lg border border-gray-200 p-6 hover:shadow-lg transition-shadow duration-300';
            serviceElement.innerHTML = `
                <h2 class="text-2xl font-bold mb-2">${service.title}</h2>
                <p class="text-gray-600 mb-4">${service.shortDescription}</p>
                <button class="read-more-btn bg-secondary text-white px-4 py-2 rounded hover:bg-opacity-90 transition-colors duration-300" data-index="${index}">Read More</button>
                <div class="full-description hidden mt-4">
                    <p>${service.fullDescription}</p>
                </div>
            `;
            servicesGrid.appendChild(serviceElement);
        });

        // Add event listeners to "Read More" buttons
        document.querySelectorAll('.read-more-btn').forEach(button => {
            button.addEventListener('click', () => {
                const index = button.getAttribute('data-index');
                const fullDescription = button.nextElementSibling;
                fullDescription.classList.toggle('hidden');
                button.textContent = fullDescription.classList.contains('hidden') ? 'Read More' : 'Read Less';
            });
        });

        // Netlify Identity
        if (window.netlifyIdentity) {
            window.netlifyIdentity.on("init", user => {
                if (!user) {
                    window.netlifyIdentity.on("login", () => {
                        document.location.href = "/admin/";
                    });
                }
            });
        }
    </script>
</body>
</html>
