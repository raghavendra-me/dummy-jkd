<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - I2F Student Services</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Poppins:wght@400;500;600;700&family=Muli:wght@400;700&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
    <style>
        .google-form-container {
            position: relative;
            width: 100%;
            height: 0;
            padding-bottom: 150%; /* Adjust this value to control the aspect ratio */
            overflow: hidden;
        }
        .google-form-wrapper {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        .google-form {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }
    </style>
</head>
<body class="font-poppins text-gray-800 flex flex-col min-h-screen">
    <header class="bg-primary text-white">
        <nav class="container mx-auto px-4 py-4 flex justify-between items-center">
            <a href="/" class="text-2xl font-bold">I2F Student Services</a>
            <button id="mobileMenuButton" class="md:hidden">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7"></path>
                </svg>
            </button>
            <ul id="mobileMenu" class="hidden md:flex space-x-4">
                <li><a href="/" class="hover:text-secondary transition-colors duration-300">Home</a></li>
                <li><a href="service.html" class="hover:text-secondary transition-colors duration-300">Services</a></li>
                <li><a href="about.html" class="hover:text-secondary transition-colors duration-300">About Us</a></li>
                <li><a href="/contact.html" class="hover:text-secondary transition-colors duration-300">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main class="flex-grow pt-20">
        <div class="google-form-container">
            <div class="google-form-wrapper">
                <iframe src="https://docs.google.com/forms/d/e/1FAIpQLSdTVaXCDL_3OKXbt938esmZi3Q5fsbIE2c4o1clsCvjmJMf0Q/viewform?embedded=true" class="google-form" frameborder="0" marginheight="0" marginwidth="0">Loading…</iframe>
            </div>
        </div>
    </main>

    <footer class="bg-primary text-white py-6 md:py-8">
        <div class="container mx-auto text-center px-4 md:px-8 max-w-7xl">
            <p class="text-sm md:text-base">&copy; 2023 I2F Student Services. All rights reserved.</p>
        </div>
    </footer>

    <script>
        // Mobile menu toggle
        const mobileMenuButton = document.getElementById('mobileMenuButton');
        const mobileMenu = document.getElementById('mobileMenu');

        mobileMenuButton.addEventListener('click', () => {
            mobileMenu.classList.toggle('hidden');
        });

        // Netlify Identity
        if (window.netlifyIdentity) {
            window.netlifyIdentity.on("init", user => {
                if (!user) {
                    window.netlifyIdentity.on("login", () => {
                        document.location.href = "/admin/";
                    });
                }
            });
        }
    </script>
</body>
</html>
